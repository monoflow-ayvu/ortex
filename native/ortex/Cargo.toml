[package]
name = "ortex"
version = "0.2.0-rc.2"
authors = []
edition = "2018"

[lib]
name = "ortex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37.1"
# rc.12, not rc.11, is the first release with Environment::register_ep_library - the
# ORT >= 1.23 plugin-EP API, and the only way to reach the Qualcomm QNN EP through an
# upstream libonnxruntime, which is not built with --use_qnn and so rejects "QNN" by
# name with "QNN execution provider is not supported in this build."
#
# default-features are off deliberately:
#   * download-binaries would fetch a HOST-arch libonnxruntime, useless when
#     cross-compiling to aarch64, and drags in a TLS stack (ring), whose build
#     script compiles host C with Nerves' cross CC and dies on `-m64`.
#   * load-dynamic dlopen()s ORT_DYLIB_PATH instead - the libonnxruntime.so the
#     nerves system installs.
#   * api-24 implies api-22, which is what gates register_ep_library.
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "half",
    "tracing",
    "load-dynamic",
    "api-24",
] }
ndarray = "0.17.2"
half = "2.2.1"
# ort reports EP registration, device selection and per-node placement through
# `tracing`; with no subscriber installed all of it is dropped. Turned on per
# session by trace_path / ORTEX_TRACE, see model::init_tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
# ONNXRuntime Execution providers
directml = ["ort/directml"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
