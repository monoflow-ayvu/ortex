[package]
name = "ortex"
version = "0.3.1"
authors = []
edition = "2021"
# ort rc.15 declares edition 2024 and rust-version 1.92, so that is the floor for this
# crate too - declared here so cargo says so, instead of failing inside a dependency.
rust-version = "1.92"

[lib]
name = "ortex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38.0"
# rc.15 carries 30+ undefined-behaviour and leak fixes in the FFI layer - the kind of
# debt that only shows up as corruption or slow growth in a process kept alive for weeks.
#
# default-features are off deliberately:
#   * download-binaries would fetch a HOST-arch libonnxruntime, useless when
#     cross-compiling to aarch64, and drags in a TLS stack (ring), whose build
#     script compiles host C with Nerves' cross CC and dies on `-m64`.
#   * load-dynamic dlopen()s ORT_DYLIB_PATH instead - the libonnxruntime.so the
#     nerves system installs.
#   * api-24 pins the ONNX Runtime API level, not the crate version: ORT_API_VERSION 24
#     is what ORT 1.24.x provides, which is what ci.yml installs and what the Nerves
#     systems ship. request_api_version() asks the loaded runtime for exactly this
#     level; bumping it (rc.13/14/15 default to 28/29/31) would require a runtime
#     upgrade everywhere at once - that coordination is D2, not this change.
#     api-24 implies api-22 (register_ep_library) and api-23.
ort = { version = "2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "half",
    "load-dynamic",
    "api-24",
] }
ndarray = "0.17.2"
half = "2.7"

# Diagnostics, off by default. ort reports EP registration, device selection and per-node
# placement through `tracing`; a subscriber turns that into a file. Both crates are behind
# the `trace` feature because on a Nerves target they are pure artifact weight:
# tracing-subscriber with env-filter pulls in regex-automata, aho-corasick, sharded-slab,
# matchers and friends - ~10 crates of the ~50 in the graph, extracted for code that only
# runs when a trace file was asked for.
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[features]
default = []
# `trace_path`/`ORTEX_TRACE` and the VERBOSE ORT log, for diagnosing why an execution
# provider did or did not claim a graph. Build with ORTEX_FEATURES=trace (or
# `features: ["trace"]` on `config :ortex, Ortex.Native`); without it both keys are a
# documented no-op.
trace = ["dep:tracing", "dep:tracing-subscriber", "ort/tracing"]

# ONNXRuntime Execution providers.
#
# rc.13 put every EP struct behind one of these cargo features, so an EP missing here has
# no binding at all: `Ortex.load(path, [:rocm])` without the feature fails with a message
# naming it (utils::ep_not_compiled) instead of falling back to the CPU.
directml = ["ort/directml"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
acl = ["ort/acl"]
onednn = ["ort/onednn"]
rocm = ["ort/rocm"]
