[package]
name = "ortex"
version = "0.3.1"
authors = []
edition = "2018"

[lib]
name = "ortex"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38.0"
# rc.15 carries 30+ undefined-behaviour and leak fixes in the FFI layer - the kind of
# debt that only shows up as corruption or slow growth in a process kept alive for weeks.
#
# default-features are off deliberately:
#   * download-binaries would fetch a HOST-arch libonnxruntime, useless when
#     cross-compiling to aarch64, and drags in a TLS stack (ring), whose build
#     script compiles host C with Nerves' cross CC and dies on `-m64`.
#   * load-dynamic dlopen()s ORT_DYLIB_PATH instead - the libonnxruntime.so the
#     nerves system installs.
#   * api-24 pins the ONNX Runtime API level, not the crate version: ORT_API_VERSION 24
#     is what ORT 1.24.x provides, which is what ci.yml installs and what the Nerves
#     systems ship. request_api_version() asks the loaded runtime for exactly this
#     level; bumping it (rc.13/14/15 default to 28/29/31) would require a runtime
#     upgrade everywhere at once - that coordination is D2, not this change.
#     api-24 implies api-22 (register_ep_library) and api-23.
ort = { version = "2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "half",
    "tracing",
    "load-dynamic",
    "api-24",
] }
ndarray = "0.17.2"
half = "2.7"
# ort reports EP registration, device selection and per-node placement through
# `tracing`; with no subscriber installed all of it is dropped. Turned on per
# session by trace_path / ORTEX_TRACE, see model::init_tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
# ONNXRuntime Execution providers.
#
# rc.13 put every EP struct behind one of these cargo features, so an EP missing here has
# no binding at all: `Ortex.load(path, [:rocm])` without the feature fails with a message
# naming it (utils::ep_not_compiled) instead of falling back to the CPU.
directml = ["ort/directml"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
acl = ["ort/acl"]
onednn = ["ort/onednn"]
rocm = ["ort/rocm"]
