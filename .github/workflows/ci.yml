name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    name: Linux ${{ matrix.elixir }}, ${{ matrix.otp }}
    strategy:
      matrix:
        elixir: ["1.17.3"]
        otp: ["27.1.2"]
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      # The crate dlopen()s libonnxruntime at runtime (ort `load-dynamic`, see
      # native/ortex/Cargo.toml); nothing else provides it on the runner. Pin tracks
      # the `api-24` feature.
      - name: Install ONNX Runtime
        run: |
          curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-linux-x64-1.24.4.tgz | tar -xz
          echo "ORT_DYLIB_PATH=$GITHUB_WORKSPACE/onnxruntime-linux-x64-1.24.4/lib/libonnxruntime.so" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: mix deps.get
      - name: Compile and check warnings
        run: mix compile --warnings-as-errors
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test

  macos:
    runs-on: macos-latest
    name: macOS
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v2
      - name: Install
        run: |
          brew update
          brew install erlang@27 elixir
      - name: Install ONNX Runtime
        run: |
          curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-osx-arm64-1.24.4.tgz | tar -xz
          echo "ORT_DYLIB_PATH=$GITHUB_WORKSPACE/onnxruntime-osx-arm64-1.24.4/lib/libonnxruntime.dylib" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: mix deps.get
      - name: Compile and check warnings
        run: mix compile --warnings-as-errors
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test
